name: Backend CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.11"
          cache: true

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: shellcheck -x -P deploy/scripts deploy/scripts/*.sh

      - name: Run tests
        run: make test

      - name: Run go vet
        run: make vet

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: |
          govulncheck ./...
          cd app/gateway
          govulncheck ./...

      - name: Build backend services
        run: |
          mkdir -p dist
          go build -o dist/wust-user ./app/user/cmd/user
          go build -o dist/wust-core-data ./app/core_data/cmd/core_data
          cd app/gateway
          go build -o ../../dist/wust-gateway ./cmd/gateway

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: wust-algo-backend-bin
          path: dist
          if-no-files-found: error
