# This is a gateway config.
name: cwxu-algo
version: v1
middlewares:
  - name: jwt
    required: true
    options:
      '@type': type.googleapis.com/gateway.middleware.jwt.v1.Jwt
      secret: replace-with-at-least-32-random-characters
      publicPaths:
        - /v1/user/auth/login
        - /v1/user/auth/register
endpoints:
  - path: /v1/user/*
    timeout: 5s
    protocol: HTTP
    backends:
#      - target: '127.0.0.1:8001'
      - target: 'discovery:///user'
#          stripPrefix: /bbs
  - path: /v1/core/*
    timeout: 5s
    protocol: HTTP
    backends:
      - target: 'discovery:///core-data'
  - path: /v1/agent/*
    timeout: 5s
    protocol: HTTP
    backends:
      - target: 'discovery:///agent'
